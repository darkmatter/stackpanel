name: CI Checks

# Lightweight, portable PR gate: a TypeScript typecheck via the repo's own
# `typecheck` turbo tasks (tsc --noEmit).
#
# It intentionally does NOT use `vp check` / `vp test`: those load
# vite.config.ts, which is loadable now that `vite-plus` is a declared
# devDependency — but `vp check` still fails on pre-existing repo-wide debt
# (1577 unformatted files per oxfmt; 454 type-aware lint errors in generated
# code, Go-template TS, and dead alchemy-era sources), and `vp test` hits
# harness mismatches (bun:test suites, live-service e2e, nix-dependent
# integration tests) that the canonical `turbo test` deliberately excludes.
# Adopting the vp gate requires clearing that debt first. This gate is also
# separate from the heavy Nix `om ci` workflow.
#
# `@stackpanel/sdk` is excluded because its typecheck has a pre-existing failure
# (its tsconfig does not pull in node types) unrelated to this gate. Remove the
# `--filter` exclusion once that's fixed so the gate covers every package that
# defines a `typecheck` script.
on:
  pull_request:
  push:
    branches: [main]

# Least-privilege GITHUB_TOKEN (CodeQL: workflows should set explicit permissions).
permissions:
  contents: read

concurrency:
  group: ci-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (tsc --noEmit)
        run: bunx turbo run typecheck --filter='!@stackpanel/sdk'
