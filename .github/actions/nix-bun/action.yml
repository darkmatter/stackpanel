name: Bun from Nix
description: >
  Install Nix if needed and put this flake's Bun on PATH. The version is
  pkgs.bun (the overlay in nix/flake/overlays.nix). Do not pass a version.

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
      with:
        extra-conf: |
          accept-flake-config = true

    - name: Add the flake's Bun to PATH
      shell: bash
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        if [[ -n "${GITHUB_TOKEN:-}" ]]; then
          export NIX_CONFIG="${NIX_CONFIG:-}"$'\n'"access-tokens = github.com=${GITHUB_TOKEN}"
        fi
        out=""
        for attempt in 1 2 3 4; do
          if out="$(nix build --accept-flake-config --no-link --print-out-paths .#bun)"; then
            break
          fi
          echo "::warning::nix build .#bun failed (attempt ${attempt}/4); retrying in $((attempt * 5))s..." >&2
          sleep $((attempt * 5))
        done
        if [[ -z "$out" ]]; then
          echo "::error::nix build .#bun failed after 4 attempts" >&2
          exit 1
        fi
        echo "$out/bin" >> "$GITHUB_PATH"
        echo "bun $($out/bin/bun --version) ($out)"
